<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sneakers</title>
    <link rel="icon" type="image/png" href="./images/nikeicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="bg-[#0C0C0E] py-[17px]">
      <div
        class="max-w-[1285px] mx-auto px-5 flex justify-between items-center"
      >
        <div class="text-center !hidden max-[1005px]:!block">
          <button
            class="inline-flex items-center justify-center text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
            type="button"
            data-drawer-target="drawer-left-example"
            data-drawer-show="drawer-left-example"
            data-drawer-placement="left"
            aria-controls="drawer-left-example"
          >
            <img src="./images/menu.svg" alt="" />
          </button>
        </div>
        <a href=""
          ><h1
            class="text-[32px] font-[700] text-[#E4E2DD] max-[450px]:!text-[24px]"
          >
            KROSSDROP.
          </h1></a
        >
        <ul class="flex gap-[32px] text-[#E4E2DD] max-[1005px]:!hidden">
          <li
            class="inline-block group relative hover:text-[#CAF231] duration-[0.5s]"
          >
            <a href="">Bosh sahifa</a>
            <span
              class="bg-[#CAF231] inline-block absolute left-1 top-6 h-1 duration-[0.5s]  w-0 group group-hover:w-full"
            ></span>
          </li>
          <li
            class="inline-block group relative hover:text-[#CAF231] duration-[0.5s]"
          >
            <a href="">Do'kon</a>
            <span
              class="bg-[#CAF231] inline-block absolute left-1 top-6 h-1 duration-[0.5s] w-0 group group-hover:w-full"
            ></span>
          </li>
          <li
            class="inline-block group relative hover:text-[#CAF231] duration-[0.5s]"
          >
            <a href="">Yangi kelganlar</a>
            <span
              class="bg-[#CAF231] inline-block absolute left-1 top-6 h-1 duration-[0.5s] w-0 group group-hover:w-full"
            ></span>
          </li>
          <li
            class="inline-block group relative hover:text-[#CAF231] duration-[0.5s]"
          >
            <a href="">Biz haqimizda</a>
            <span
              class="bg-[#CAF231] inline-block absolute left-1 top-6 h-1 duration-[0.5s] w-0 group group-hover:w-full"
            ></span>
          </li>
          <li
            class="inline-block group relative hover:text-[#CAF231] duration-[0.5s]"
          >
            <a href="">Aloqa</a>
            <span
              class="bg-[#CAF231] inline-block absolute left-1 top-6 h-1 duration-[0.5s] w-0 group group-hover:w-full"
            ></span>
          </li>
        </ul>
        <ul class="flex items-center gap-[24px]">
          <li>
            <button><img src="./images/search.svg" alt="" /></button>
          </li>
          <li>
            <button><img src="./images/like.svg" alt="" /></button>
          </li>
          <li>
            <button><img src="./images/cart.svg" alt="" /></button>
          </li>
          <li>
            <button
              class="text-[#171E00] text-[16px] font-normal bg-[#CAF231] rounded-[9999px] p-[8px_24px] border-[#CAF231] border-[2px] hover:bg-transparent hover:text-white duration-[0.5s] max-[1005px]:!hidden"
            >
              KIRISH
            </button>
          </li>
        </ul>
      </div>
    </header>
    <main>
      <section>
        <div class="max-w-[1285px] mx-auto px-5">
          <div
            id="default-carousel"
            class="relative w-full"
            data-carousel="slide"
          >
            <!-- Carousel wrapper -->
            <div class="relative h-56 overflow-hidden rounded-base md:h-96">
              <!-- Item 1 -->
              <div class="hidden duration-700 ease-in-out" data-carousel-item>
                <img
                  src="./images/hero1.jpg"
                  class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                  alt="..."
                />
              </div>
              <!-- Item 2 -->
              <div class="hidden duration-700 ease-in-out" data-carousel-item>
                <img
                  src="./images/hero2.png"
                  class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                  alt="..."
                />
              </div>
              <!-- Item 3 -->
              <div class="hidden duration-700 ease-in-out" data-carousel-item>
                <img
                  src="./images/hero3.png"
                  class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                  alt="..."
                />
              </div>
            </div>
            <!-- Slider indicators -->
            <div
              class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse"
            >
              <button
                type="button"
                class="w-20 h-2 hover:!bg-[#CAF231] rounded-[20px]"
                aria-current="true"
                aria-label="Slide 1"
                data-carousel-slide-to="0"
              ></button>
              <button
                type="button"
                class="w-20 h-2 hover:!bg-[#CAF231] rounded-[20px]"
                aria-current="false"
                aria-label="Slide 2"
                data-carousel-slide-to="1"
              ></button>
              <button
                type="button"
                class="w-20 h-2 hover:!bg-[#CAF231] rounded-[20px]"
                aria-current="false"
                aria-label="Slide 3"
                data-carousel-slide-to="2"
              ></button>
            </div>
            <!-- Slider controls -->
            <button
              type="button"
              class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
              data-carousel-prev
            >
              <span
                class="inline-flex items-center justify-center w-10 h-10 rounded-base bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none"
              >
                <svg
                  class="w-5 h-5 text-white rtl:rotate-180"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m15 19-7-7 7-7"
                  />
                </svg>
                <span class="sr-only">Previous</span>
              </span>
            </button>
            <button
              type="button"
              class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
              data-carousel-next
            >
              <span
                class="inline-flex items-center justify-center w-10 h-10 rounded-base bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none"
              >
                <svg
                  class="w-5 h-5 text-white rtl:rotate-180"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m9 5 7 7-7 7"
                  />
                </svg>
                <span class="sr-only">Next</span>
              </span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- drawer component -->
    <div
      id="drawer-left-example"
      class="fixed top-0 left-0 z-40 h-screen bg-[#131411] text-[#CAF231] p-4 overflow-y-auto transition-transform -translate-x-full w-96"
      tabindex="-1"
      aria-labelledby="drawer-left-label"
    >
      <div class="border-b border-default pb-4 mb-5 flex items-center">
        <h5
          id="drawer-left-example"
          class="inline-flex items-center text-lg font-medium text-body"
        >
          KROSSDROP.
        </h5>
        <button
          type="button"
          data-drawer-hide="drawer-left-example"
          aria-controls="drawer-left-example"
          class="text-body bg-transparent hover:text-heading hover:bg-neutral-tertiary rounded-base w-9 h-9 absolute top-2.5 end-2.5 flex items-center justify-center"
        >
          <svg
            class="w-5 h-5"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18 17.94 6M18 18 6.06 6"
            />
          </svg>
          <span class="sr-only">Close menu</span>
        </button>
      </div>
      <ul class="flex gap-[32px] text-[#E4E2DD] flex-col">
        <li
          class="inline-block group relative hover:text-[#CAF231] duration-[0.5s]"
        >
          <a href="">Bosh sahifa</a>
          <span
            class="bg-[#CAF231] inline-block absolute left-1 top-6 h-1 duration-[0.5s] w-0 group group-hover:w-22"
          ></span>
        </li>
        <li
          class="inline-block group relative hover:text-[#CAF231] duration-[0.5s]"
        >
          <a href="">Do'kon</a>
          <span
            class="bg-[#CAF231] inline-block absolute left-1 top-6 h-1 duration-[0.5s] w-0 group group-hover:w-13"
          ></span>
        </li>
        <li
          class="inline-block group relative hover:text-[#CAF231] duration-[0.5s]"
        >
          <a href="">Yangi kelganlar</a>
          <span
            class="bg-[#CAF231] inline-block absolute left-1 top-6 h-1 duration-[0.5s] w-0 group group-hover:w-28"
          ></span>
        </li>
        <li
          class="inline-block group relative hover:text-[#CAF231] duration-[0.5s]"
        >
          <a href="">Biz haqimizda</a>
          <span
            class="bg-[#CAF231] inline-block absolute left-1 top-6 h-1 duration-[0.5s] w-0 group group-hover:w-25"
          ></span>
        </li>
        <li
          class="inline-block group relative hover:text-[#CAF231] duration-[0.5s]"
        >
          <a href="">Aloqa</a>
          <span
            class="bg-[#CAF231] inline-block absolute left-1 top-6 h-1 duration-[0.5s] w-0 group group-hover:w-12"
          ></span>
        </li>
      </ul>
      <br />
      <br />

      <button
        class="text-[#171E00] text-[16px] font-normal bg-[#CAF231] rounded-[9999px] p-[8px_24px] border-[#CAF231] border-[2px] hover:bg-transparent hover:text-white duration-[0.5s] max-[1005px]:!w-full"
      >
        KIRISH
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  </body>
</html>
